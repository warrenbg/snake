<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake - Mode Multijoueur</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    h1, h2 {
      margin: 10px;
    }

    input, select, button {
      font-size: 16px;
      margin: 5px;
      padding: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }

    canvas {
      border: 2px solid #fff;
      margin-top: 20px;
      background: #111;
      max-width: 100%;
    }

    #gameOver {
      display: none;
      text-align: center;
      margin-top: 20px;
      font-size: 20px;
      color: red;
    }

    #restartButton {
      display: none;
      margin-top: 10px;
    }

    #leaderboard {
      margin-top: 30px;
      border-collapse: collapse;
      background: #333;
    }

    th, td {
      padding: 8px 16px;
      border: 1px solid #666;
      text-align: center;
    }

    @media (max-width: 768px) {
      #mobileControls {
        display: block;
      }
    }

    #startCountdown {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 60px;
      padding: 40px;
      border-radius: 20px;
      z-index: 10;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Snake - Mode Multijoueur</h1>

  <input type="text" id="playerNameInput" placeholder="Nom du joueur" />
  <select id="speedSelector">
    <option value="200">Lent</option>
    <option value="100" selected>Moyen</option>
    <option value="50">Rapide</option>
  </select>
  <button id="startButton">Commencer</button>

  <div id="startCountdown"><h2 id="countdownText">3</h2></div>

  <canvas id="snakeGame" width="400" height="400" style="display:none;"></canvas>

  <div id="gameOver">
    <strong>Game Over</strong><br>
    Score Joueur 1 : <span id="score1"></span><br>
    Score Joueur 2 : <span id="score2"></span>
  </div>

  <button id="restartButton" onclick="restartGame()">Rejouer</button>

  <h2>Classement</h2>
  <table id="leaderboard">
    <thead>
      <tr><th>Joueur</th><th>Meilleur Score</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const canvas = document.getElementById("snakeGame");
    const ctx = canvas.getContext("2d");
    const scale = 20;
    const rows = canvas.height / scale;
    const columns = canvas.width / scale;

    let player1, player2, fruit, gameInterval;
    let playerName = "";

    const startButton = document.getElementById("startButton");
    const playerNameInput = document.getElementById("playerNameInput");
    const speedSelector = document.getElementById("speedSelector");
    const gameOverElement = document.getElementById("gameOver");
    const score1Element = document.getElementById("score1");
    const score2Element = document.getElementById("score2");
    const countdown = document.getElementById("startCountdown");
    const countdownText = document.getElementById("countdownText");

    startButton.onclick = () => {
      const name = playerNameInput.value.trim();
      if (!name) {
        alert("Veuillez entrer un nom.");
        return;
      }
      playerName = name;
      startButton.style.display = "none";
      playerNameInput.style.display = "none";
      speedSelector.style.display = "none";
      canvas.style.display = "block";
      setup();
    };

    function setup() {
      if (gameInterval) clearInterval(gameInterval);
      player1 = new Snake('player1');
      player2 = new Snake('player2');
      fruit = new Fruit();
      gameOverElement.style.display = "none";
      document.getElementById("restartButton").style.display = "none";

      let count = 3;
      countdown.style.display = "block";
      countdownText.textContent = count;

      const speed = parseInt(speedSelector.value);

      const countdownInterval = setInterval(() => {
        count--;
        if (count === 0) {
          countdownText.textContent = "GO!";
        } else if (count < 0) {
          clearInterval(countdownInterval);
          countdown.style.display = "none";
          gameInterval = setInterval(gameLoop, speed);
        } else {
          countdownText.textContent = count;
        }
      }, 1000);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      player1.update();
      player1.draw();
      player2.update();
      player2.draw();
      fruit.draw();

      if (player1.eat(fruit)) {
        fruit.randomize();
        player1.grow();
      }
      if (player2.eat(fruit)) {
        fruit.randomize();
        player2.grow();
      }

      if (player1.collides() || player2.collides()) {
        endGame();
      }
    }

    function endGame() {
      clearInterval(gameInterval);
      const score1 = player1.length - 1;
      const score2 = player2.length - 1;
      gameOverElement.style.display = "block";
      document.getElementById("restartButton").style.display = "inline-block";
      score1Element.innerHTML = score1;
      score2Element.innerHTML = score2;
      updateLeaderboard();
    }

    function restartGame() {
      setup();
    }

    function Snake(player) {
      this.player = player;
      this.snakeArray = [{ x: 10, y: 10 }];
      this.length = 1;
      this.direction = player === 'player1' ? 'right' : 'left';

      this.update = function () {
        const head = { ...this.snakeArray[0] };
        switch (this.direction) {
          case "up": head.y -= 1; break;
          case "down": head.y += 1; break;
          case "left": head.x -= 1; break;
          case "right": head.x += 1; break;
        }
        this.snakeArray.unshift(head);
        if (this.snakeArray.length > this.length) {
          this.snakeArray.pop();
        }
      };

      this.draw = function () {
        this.snakeArray.forEach((seg) => {
          ctx.fillStyle = "#0f0"; // Vert
          ctx.fillRect(seg.x * scale, seg.y * scale, scale, scale);
        });
      };

      this.changeDirection = function (dir) {
        const opposite = { up: "down", down: "up", left: "right", right: "left" };
        if (dir !== opposite[this.direction]) {
          this.direction = dir;
        }
      };

      this.eat = function (fruit) {
        return this.snakeArray[0].x === fruit.x && this.snakeArray[0].y === fruit.y;
      };

      this.grow = function () {
        this.length++;
      };

      this.collides = function () {
        const head = this.snakeArray[0];
        return head.x < 0 || head.y < 0 || head.x >= columns || head.y >= rows ||
          this.snakeArray.slice(1).some(s => s.x === head.x && s.y === head.y);
      };
    }

    function Fruit() {
      this.x = 5;
      this.y = 5;

      this.randomize = function () {
        this.x = Math.floor(Math.random() * columns);
        this.y = Math.floor(Math.random() * rows);
      };

      this.draw = function () {
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(this.x * scale + scale / 2, this.y * scale + scale / 2, scale / 2, 0, Math.PI * 2);
        ctx.fill();
      };
    }

    function saveHighScore(name, score) {
      const scores = JSON.parse(localStorage.getItem("snakeHighScores")) || {};
      const best = scores[name] || 0;
      if (score > best) {
        scores[name] = score;
        localStorage.setItem("snakeHighScores", JSON.stringify(scores));
      }
      return scores[name];
    }

    function updateLeaderboard() {
      const scores = JSON.parse(localStorage.getItem("snakeHighScores")) || {};
      const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const tbody = document.querySelector("#leaderboard tbody");
      tbody.innerHTML = "";
      for (const [name, score] of sorted) {
        tbody.innerHTML += `<tr><td>${name}</td><td>${score}</td></tr>`;
      }
    }

    window.addEventListener("keydown", (e) => {
      const keyMap = {
        player1: {
          ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right"
        },
        player2: {
          w: "up", s: "down", a: "left", d: "right"
        }
      };

      if (keyMap.player1[e.key]) player1.changeDirection(keyMap.player1[e.key]);
      if (keyMap.player2[e.key]) player2.changeDirection(keyMap.player2[e.key]);
    });

    updateLeaderboard();
  </script>
</body>
</html>
