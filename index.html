<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake - Jeu</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #fff;
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin: 10px;
    }

    input, select, button {
      font-size: 16px;
      margin: 5px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #28a745;
      color: white;
      cursor: pointer;
    }

    canvas {
      border: 2px solid #000;
      margin-top: 20px;
      background: #fff;
      max-width: 100%;
    }

    #gameOver {
      display: none;
      text-align: center;
      margin-top: 20px;
      font-size: 20px;
      color: red;
    }

    #restartButton {
      display: none;
      margin-top: 10px;
    }

    #startCountdown {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      font-size: 60px;
      padding: 40px;
      border-radius: 20px;
      z-index: 10;
      text-align: center;
      border: 2px solid #000;
    }
  </style>
</head>
<body>

  <h1>Snake - Jeu</h1>

  <input type="text" id="playerNameInput" placeholder="Nom du joueur" />
  <select id="speedSelector">
    <option value="200">Lent</option>
    <option value="100" selected>Moyen</option>
    <option value="50">Rapide</option>
  </select>
  <button id="startButton">Commencer</button>

  <div id="startCountdown"><h2 id="countdownText">3</h2></div>

  <canvas id="snakeGame" width="400" height="400" style="display:none;"></canvas>

  <div id="gameOver">
    <strong>Game Over</strong><br>
    Score : <span id="score"></span>
  </div>

  <button id="restartButton" onclick="restartGame()">Rejouer</button>

  <script>
    const canvas = document.getElementById("snakeGame");
    const ctx = canvas.getContext("2d");
    const scale = 20;
    const rows = canvas.height / scale;
    const columns = canvas.width / scale;

    let snake, fruit, gameInterval;
    let playerName = "";

    const startButton = document.getElementById("startButton");
    const playerNameInput = document.getElementById("playerNameInput");
    const speedSelector = document.getElementById("speedSelector");
    const gameOverElement = document.getElementById("gameOver");
    const scoreElement = document.getElementById("score");
    const countdown = document.getElementById("startCountdown");
    const countdownText = document.getElementById("countdownText");

    startButton.onclick = () => {
      const name = playerNameInput.value.trim();
      if (!name) {
        alert("Veuillez entrer un nom.");
        return;
      }
      playerName = name;
      startButton.style.display = "none";
      playerNameInput.style.display = "none";
      speedSelector.style.display = "none";
      canvas.style.display = "block";
      setup();
    };

    function setup() {
      if (gameInterval) clearInterval(gameInterval);
      snake = new Snake();
      fruit = new Fruit();
      gameOverElement.style.display = "none";
      document.getElementById("restartButton").style.display = "none";

      let count = 3;
      countdown.style.display = "block";
      countdownText.textContent = count;

      const speed = parseInt(speedSelector.value);

      const countdownInterval = setInterval(() => {
        count--;
        if (count === 0) {
          countdownText.textContent = "GO!";
        } else if (count < 0) {
          clearInterval(countdownInterval);
          countdown.style.display = "none";
          gameInterval = setInterval(gameLoop, speed);
        } else {
          countdownText.textContent = count;
        }
      }, 1000);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      snake.update();
      snake.draw();
      fruit.draw();

      if (snake.eat(fruit)) {
        fruit.randomize();
        snake.grow();
      }

      if (snake.collides()) {
        endGame();
      }
    }

    function endGame() {
      clearInterval(gameInterval);
      const score = snake.length - 1;
      gameOverElement.style.display = "block";
      document.getElementById("restartButton").style.display = "inline-block";
      scoreElement.innerHTML = score;
    }

    function restartGame() {
      setup();
    }

    function Snake() {
      this.snakeArray = [{ x: 10, y: 10 }];
      this.length = 1;
      this.direction = 'right';

      this.update = function () {
        const head = { ...this.snakeArray[0] };
        switch (this.direction) {
          case "up": head.y -= 1; break;
          case "down": head.y += 1; break;
          case "left": head.x -= 1; break;
          case "right": head.x += 1; break;
        }
        this.snakeArray.unshift(head);
        if (this.snakeArray.length > this.length) {
          this.snakeArray.pop();
        }
      };

      this.draw = function () {
        this.snakeArray.forEach((seg) => {
          ctx.fillStyle = "#0f0"; // Toujours vert
          ctx.fillRect(seg.x * scale, seg.y * scale, scale, scale);
        });
      };

      this.changeDirection = function (dir) {
        const opposite = { up: "down", down: "up", left: "right", right: "left" };
        if (dir !== opposite[this.direction]) {
          this.direction = dir;
        }
      };

      this.eat = function (fruit) {
        return this.snakeArray[0].x === fruit.x && this.snakeArray[0].y === fruit.y;
      };

      this.grow = function () {
        this.length++;
      };

      this.collides = function () {
        const head = this.snakeArray[0];
        return head.x < 0 || head.y < 0 || head.x >= columns || head.y >= rows ||
          this.snakeArray.slice(1).some(s => s.x === head.x && s.y === head.y);
      };
    }

    function Fruit() {
      this.x = 5;
      this.y = 5;

      this.randomize = function () {
        this.x = Math.floor(Math.random() * columns);
        this.y = Math.floor(Math.random() * rows);
      };

      this.draw = function () {
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(this.x * scale + scale / 2, this.y * scale + scale / 2, scale / 2, 0, Math.PI * 2);
        ctx.fill();
      };
    }

    window.addEventListener("keydown", (e) => {
      const keyMap = {
        ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right"
      };

      if (keyMap[e.key]) snake.changeDirection(keyMap[e.key]);
    });
  </script>
</body>
</html>
