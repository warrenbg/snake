<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jeu Snake</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    canvas {
      border: 1px solid #000;
      margin-top: 10px;
    }
    #gameOver {
      display: none;
      text-align: center;
      font-size: 20px;
      color: red;
      margin-top: 20px;
    }
    #restartButton {
      display: none;
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    input, select, button {
      margin: 5px;
      font-size: 16px;
    }
    table {
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      padding: 6px 12px;
      border: 1px solid #999;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Snake Game</h1>

  <input type="text" id="playerNameInput" placeholder="Entrez votre nom" />
  <select id="speedSelector">
    <option value="200">Lent</option>
    <option value="100" selected>Moyen</option>
    <option value="50">Rapide</option>
  </select>
  <button id="startButton">Commencer</button>

  <canvas id="snakeGame" width="400" height="400" style="display:none;"></canvas>

  <div id="gameOver">
    <strong>Game Over</strong><br>
    Joueur : <span id="playerNameDisplay"></span><br>
    Score : <span id="score"></span><br>
  </div>

  <button id="restartButton" onclick="restartGame()">Rejouer</button>

  <h2>Classement</h2>
  <table id="leaderboard">
    <thead>
      <tr><th>Joueur</th><th>Meilleur Score</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const canvas = document.getElementById('snakeGame');
    const ctx = canvas.getContext('2d');
    const scale = 20;
    const rows = canvas.height / scale;
    const columns = canvas.width / scale;

    let snake, fruit, gameInterval;
    let playerName = '';

    const playerNameInput = document.getElementById('playerNameInput');
    const playerNameDisplay = document.getElementById('playerNameDisplay');
    const scoreElement = document.getElementById('score');
    const gameOverElement = document.getElementById('gameOver');
    const restartButton = document.getElementById('restartButton');
    const speedSelector = document.getElementById('speedSelector');
    const startButton = document.getElementById('startButton');

    startButton.onclick = () => {
      const name = playerNameInput.value.trim();
      if (name === '') {
        alert("Veuillez entrer un nom.");
        return;
      }
      playerName = name;
      document.getElementById('snakeGame').style.display = 'block';
      startButton.style.display = 'none';
      playerNameInput.style.display = 'none';
      speedSelector.style.display = 'none';
      setup();
    };

    function setup() {
      if (gameInterval) clearInterval(gameInterval);
      snake = new Snake();
      fruit = new Fruit();
      gameOverElement.style.display = 'none';
      restartButton.style.display = 'none';

      const speed = parseInt(speedSelector.value);
      gameInterval = setInterval(gameLoop, speed);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      snake.update();
      snake.draw();
      fruit.draw();

      if (snake.eat(fruit)) {
        fruit.randomize();
        snake.grow();
      }

      if (snake.collides()) {
        gameOver();
      }
    }

    function gameOver() {
      clearInterval(gameInterval);
      gameOverElement.style.display = 'block';
      restartButton.style.display = 'inline-block';

      const score = snake.length - 1;
      const best = saveHighScore(playerName, score);

      scoreElement.innerHTML = `${score}<br>Meilleur score : ${best}`;
      playerNameDisplay.textContent = playerName;

      updateLeaderboard();
    }

    function restartGame() {
      setup();
    }

    function Snake() {
      this.snakeArray = [{ x: 2, y: 2 }];
      this.direction = 'right';
      this.length = 1;

      this.draw = function () {
        this.snakeArray.forEach((segment, index) => {
          ctx.fillStyle = index === 0 ? 'green' : 'green';
          ctx.fillRect(segment.x * scale, segment.y * scale, scale, scale);
        });
      };

      this.update = function () {
        let head = { ...this.snakeArray[0] };
        switch (this.direction) {
          case 'up': head.y -= 1; break;
          case 'down': head.y += 1; break;
          case 'left': head.x -= 1; break;
          case 'right': head.x += 1; break;
        }
        this.snakeArray.unshift(head);
        if (this.snakeArray.length > this.length) this.snakeArray.pop();
      };

      this.changeDirection = function (direction) {
        if (direction === 'up' && this.direction !== 'down') this.direction = 'up';
        else if (direction === 'down' && this.direction !== 'up') this.direction = 'down';
        else if (direction === 'left' && this.direction !== 'right') this.direction = 'left';
        else if (direction === 'right' && this.direction !== 'left') this.direction = 'right';
      };

      this.eat = function (fruit) {
        return this.snakeArray[0].x === fruit.x && this.snakeArray[0].y === fruit.y;
      };

      this.grow = function () {
        this.length++;
      };

      this.collides = function () {
        const head = this.snakeArray[0];
        return head.x < 0 || head.x >= columns || head.y < 0 || head.y >= rows ||
          this.snakeArray.slice(1).some(seg => seg.x === head.x && seg.y === head.y);
      };
    }

    function Fruit() {
      this.x = 5;
      this.y = 5;

      this.randomize = function () {
        this.x = Math.floor(Math.random() * columns);
        this.y = Math.floor(Math.random() * rows);
      };

      this.draw = function () {
        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.arc(this.x * scale + scale / 2, this.y * scale + scale / 2, scale / 2, 0, Math.PI * 2);
        ctx.fill();
      };
    }

    function saveHighScore(name, score) {
      const storedScores = JSON.parse(localStorage.getItem("snakeHighScores")) || {};
      const previous = storedScores[name] || 0;

      if (score > previous) {
        storedScores[name] = score;
        localStorage.setItem("snakeHighScores", JSON.stringify(storedScores));
      }

      return storedScores[name];
    }

    function updateLeaderboard() {
      const leaderboard = document.querySelector("#leaderboard tbody");
      const scores = JSON.parse(localStorage.getItem("snakeHighScores")) || {};

      const sortedScores = Object.entries(scores)
        .sort((a, b) => b[1] - a[1]);

      leaderboard.innerHTML = "";

      for (const [name, score] of sortedScores) {
        const row = `<tr><td>${name}</td><td>${score}</td></tr>`;
        leaderboard.innerHTML += row;
      }
    }

    window.addEventListener('keydown', e => {
      const direction = e.key.replace('Arrow', '').toLowerCase();
      snake.changeDirection(direction);
    });

    updateLeaderboard(); // Affiche le classement dès le chargement
  </script>
</body>
</html>
